# /etc/nginx/conf.d/kotori-prompts.conf
#
# prompts.kanbekotori.top 的站点块（替换原 kotori.conf 里的占位 server 块即可）。
# 注意：443 端口由 nginx 统一持有，本文件只新增 server 块，不动 panel 与 8443。
#
# 放好后执行：
#   nginx -t && systemctl reload nginx

# 让静态资源走 gzip：前端主包 ~760 KB，压缩后 ~245 KB
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript
           text/javascript application/xml image/svg+xml;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prompts.kanbekotori.top;

    ssl_certificate     /etc/ssl/kotori/site.crt;
    ssl_certificate_key /etc/ssl/kotori/site.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 只允许走 HTTPS，避免明文暴露
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 提示词正文可能比较长，给接口留足空间（默认 1m）
    client_max_body_size 12m;

    access_log /var/log/nginx/prompts.access.log;
    error_log  /var/log/nginx/prompts.error.log;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering    on;
    }

    # 带内容哈希的前端产物：让浏览器长期缓存
    location /assets/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
